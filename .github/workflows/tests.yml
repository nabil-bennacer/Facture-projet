name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Aucune clé ni donnée réelle nécessaire : fausse couche silver + faux LLM local
      - name: Serveur MCP (outils, transparence SQL, lecture seule)
        run: python tests/test_mcp_server.py
      - name: Agent (fournisseurs anthropic et compatible OpenAI)
        run: python tests/test_agent.py
      - name: Image Docker
        run: docker build -t facture .
